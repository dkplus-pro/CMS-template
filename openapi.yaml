openapi: 3.0.3
info:
  title: CMS Admin API
  version: 0.2.0
  description: |
    CMS 管理后台接口契约,前后端唯一事实源。

    修改流程:改本文件 → `pnpm gen:api` 双端生成 → 双端实现。
    生成物(apps/admin/src/api/generated/、apps/server/gen/)禁止手改。

    响应包装:传输层统一为 `{code, message, data}`(code 等于 HTTP 状态码);
    本契约描述的是 data 载荷,admin 在 mutator(src/api/client.ts)统一解包。
tags:
  - name: system
    description: 系统公共接口
  - name: auth
    description: 认证与账号
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthz
      summary: 健康检查
      tags:
        - system
      security: []
      responses:
        "200":
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"
  /auth/login:
    post:
      operationId: login
      summary: 登录
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功,返回 token 与当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: 用户名或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 账号已被禁用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: 退出登录(MVP 为前端清 token,服务端不失效)
      tags:
        - auth
      responses:
        "204":
          description: 退出成功
  /auth/me:
    get:
      operationId: getMe
      summary: 当前用户信息(含角色与权限码,供动态菜单预留)
      tags:
        - auth
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
  /auth/password:
    put:
      operationId: changePassword
      summary: 修改密码(校验旧密码)
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: 修改成功
        "400":
          description: 旧密码错误或参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP 状态码
        message:
          type: string
          description: 错误描述
    PageRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    PageMeta:
      type: object
      required:
        - total
      properties:
        total:
          type: integer
          description: 总条数
    HealthzResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 64
    LoginResponse:
      type: object
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
          description: token 过期时间
        user:
          $ref: "#/components/schemas/UserInfo"
    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
          minLength: 6
          maxLength: 64
        newPassword:
          type: string
          minLength: 6
          maxLength: 64
    UserInfo:
      type: object
      required:
        - id
        - username
        - nickname
        - status
        - roles
        - permissions
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
        status:
          type: boolean
        roles:
          type: array
          description: 角色码列表
          items:
            type: string
        permissions:
          type: array
          description: 权限码列表(阶段 2/3 填充)
          items:
            type: string
